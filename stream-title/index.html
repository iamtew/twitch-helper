<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stream Title</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="titleBox">Loading…</div>

<button id="menuToggle" style="display:none;">⭕</button>

<div id="settings" style="display:none;">
  <label>Font Size</label>
  <input id="fontSize" type="range" min="1" max="10" step="0.1">

  <label>Font Color</label>
  <input id="fontColor" type="color">

  <label>Font Outline</label>
  <input id="border" type="checkbox">

  <label>Outline Color</label>
  <input id="outlineColor" type="color">

  <label>Outline Thickness</label>
  <input id="borderThickness" type="range" min="1" max="20">

  <label>Font FX</label>
  <input id="fontFX" type="checkbox">

  <label>Font FX Offset</label>
  <input id="fontFXOffset" type="range" min="1" max="20">

  <label>Wrap</label>
  <input id="wrap" type="checkbox">

  <label>Scroll</label>
  <input id="scroll" type="checkbox">

  <label>Scroll Speed</label>
  <input id="speed" type="range" min="1" max="10">

  <label>Direction</label>
  <select id="direction">
    <option value="rtl">Right → Left</option>
    <option value="ltr">Left → Right</option>
  </select>

  <button id="resetBtn" style="margin-top:15px;width:100%;">Reset</button>
</div>

<script src="app.js"></script>
</body>
</html>
