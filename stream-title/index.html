<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stream Title</title>

<style>
@import url('https://fonts.cdnfonts.com/css/londrina-solid');

body {
  margin:0;
  background:transparent;
  font-family:'Londrina Solid', sans-serif;
  color:#000;
}

/* --- TITLE DISPLAY --- */
#titleBox {
  position:fixed;
  top:20px;
  left:20px;
  white-space:var(--wrap-mode, normal);
  font-size:var(--font-size, 3.5em);
  overflow:hidden;
}

/* --- MARQUEE --- */
.marquee {
  display:inline-block;
  white-space:nowrap;
  animation: scrollAnim linear infinite;
}

@keyframes scrollAnim {
  from { transform: translateX(var(--scroll-start)); }
  to   { transform: translateX(var(--scroll-end)); }
}

/* --- SETTINGS MENU --- */
#settings {
  position:fixed;
  top:60px;
  right:20px;
  background:rgba(255,255,255,0.85);
  padding:12px;
  border-radius:8px;
  font-size:16px;
  color:#000;
  width:240px;
  font-family:sans-serif;
}

#settings label {
  font-weight:bold;
  display:block;
  margin-top:10px;
}

#settings input[type=range] {
  width:100%;
}

/* --- MENU TOGGLE BUTTON --- */
#menuToggle {
  position:fixed;
  top:20px;
  right:20px;
  width:32px;
  height:32px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,0.9);
  cursor:pointer;
  font-size:18px;
  line-height:32px;
  text-align:center;
  font-family:sans-serif;
}
</style>
</head>

<body>

<div id="titleBox">Loading…</div>

<button id="menuToggle" style="display:none;">⭕</button>

<div id="settings" style="display:none;">
  <label>Font Size</label>
  <input id="fontSize" type="range" min="1" max="10" step="0.1">

  <label>Wrap</label>
  <input id="wrap" type="checkbox">

  <label>Scroll</label>
  <input id="scroll" type="checkbox">

  <label>Scroll Speed</label>
  <input id="speed" type="range" min="1" max="10">

  <label>Direction</label>
  <select id="direction">
    <option value="rtl">Right → Left</option>
    <option value="ltr">Left → Right</option>
  </select>

  <button id="resetBtn" style="margin-top:15px;width:100%;">Reset</button>
</div>

<script>
async function main() {
  const params = new URLSearchParams(location.search);

  const user = params.get("user");
  const titleBox = document.getElementById("titleBox");

  if (!user) {
    titleBox.textContent =
      "Error: No user configured. Add ?user=USERNAME to the URL.";
    return;
  }

  const url = `https://decapi.me/twitch/title/${encodeURIComponent(user)}`;
  const res = await fetch(url);
  const text = await res.text();
  titleBox.textContent = text || `No title found for "${user}".`;

  initMenuState();
  applySettings();
}

/* --- MENU STATE HANDLING --- */
function initMenuState() {
  const params = new URLSearchParams(location.search);
  const menuState = (params.get("menu") || "on").toLowerCase();

  const settings = document.getElementById("settings");
  const toggle = document.getElementById("menuToggle");

  if (menuState === "disable") {
    settings.style.display = "none";
    toggle.style.display = "none";
    return;
  }

  toggle.style.display = "block";

  if (menuState === "on") {
    settings.style.display = "block";
    toggle.textContent = "❌";
  } else {
    settings.style.display = "none";
    toggle.textContent = "⭕";
  }

  toggle.onclick = () => {
    const isVisible = settings.style.display !== "none";
    const newState = isVisible ? "off" : "on";
    updateURL("menu", newState);
  };
}

/* --- SETTINGS APPLICATION --- */
function applySettings() {
  const params = new URLSearchParams(location.search);

  const fontSize = params.get("fontSize") || 3.5;
  const wrap = params.get("wrap") === "on";
  const scroll = params.get("scroll") === "on";
  const speed = params.get("speed") || 3;
  const direction = params.get("direction") || "rtl";

  document.documentElement.style.setProperty("--font-size", fontSize + "em");
  document.documentElement.style.setProperty(
    "--wrap-mode",
    wrap ? "normal" : "nowrap"
  );

  const titleBox = document.getElementById("titleBox");
  const rawText = titleBox.textContent;

  if (scroll) {
    const marquee = document.createElement("span");
    marquee.className = "marquee";
    marquee.textContent = rawText;

    const duration = 60 / speed;

    if (direction === "rtl") {
      document.documentElement.style.setProperty("--scroll-start", window.innerWidth + "px");
      document.documentElement.style.setProperty("--scroll-end", -titleBox.scrollWidth + "px");
    } else {
      document.documentElement.style.setProperty("--scroll-start", -titleBox.scrollWidth + "px");
      document.documentElement.style.setProperty("--scroll-end", window.innerWidth + "px");
    }

    marquee.style.animationDuration = duration + "s";
    titleBox.innerHTML = "";
    titleBox.appendChild(marquee);
  } else {
    titleBox.textContent = rawText;
  }

  updateUI(fontSize, wrap, scroll, speed, direction);
}

function updateURL(key, value) {
  const params = new URLSearchParams(location.search);
  params.set(key, value);
  history.replaceState({}, "", "?" + params.toString());
  if (key === "menu") {
    initMenuState();
  } else {
    applySettings();
  }
}

function updateUI(fontSize, wrap, scroll, speed, direction) {
  const fontSizeEl = document.getElementById("fontSize");
  const wrapEl = document.getElementById("wrap");
  const scrollEl = document.getElementById("scroll");
  const speedEl = document.getElementById("speed");
  const directionEl = document.getElementById("direction");

  if (!fontSizeEl) return;

  fontSizeEl.value = fontSize;
  wrapEl.checked = wrap;
  scrollEl.checked = scroll;
  speedEl.value = speed;
  directionEl.value = direction;
}

/* --- RESET BUTTON --- */
function resetSettings() {
  const params = new URLSearchParams(location.search);

  params.set("fontSize", 3.5);
  params.set("wrap", "off");
  params.set("scroll", "off");
  params.set("speed", 3);
  params.set("direction", "rtl");

  history.replaceState({}, "", "?" + params.toString());
  applySettings();
}

document.getElementById("resetBtn").onclick = resetSettings;

/* --- SETTINGS EVENTS --- */
document.getElementById("fontSize").oninput = e =>
  updateURL("fontSize", e.target.value);

document.getElementById("wrap").onchange = e =>
  updateURL("wrap", e.target.checked ? "on" : "off");

document.getElementById("scroll").onchange = e =>
  updateURL("scroll", e.target.checked ? "on" : "off");

document.getElementById("speed").oninput = e =>
  updateURL("speed", e.target.value);

document.getElementById("direction").onchange = e =>
  updateURL("direction", e.target.value);

main();
</script>

</body>
</html>
